<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stelle Cadenti ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  margin: 0;
  font-family: 'Nunito', sans-serif;
  background: #06080f;
  overflow: hidden;
  height: 100vh;
  cursor: none;
}

canvas { display: block; }

.cursor {
  position: fixed;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(200,180,255,0.4) 60%, transparent 100%);
  pointer-events: none;
  transform: translate(-50%,-50%);
  z-index: 9999;
  box-shadow: 0 0 12px rgba(200,180,255,0.8), 0 0 24px rgba(200,180,255,0.3);
}

.ui {
  position: fixed;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 16px; align-items: center;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 99px;
  padding: 8px 24px;
  z-index: 10;
}

.ui-item {
  display: flex; align-items: center; gap: 6px;
}
.ui-label {
  font-size: 0.75rem; font-weight: 700;
  color: rgba(200,180,255,0.6);
  text-transform: uppercase; letter-spacing: 0.8px;
}
.ui-val {
  font-size: 1rem; font-weight: 900;
  color: #e2d9ff;
}

.hint {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  font-size: 0.78rem; font-weight: 700;
  color: rgba(200,180,255,0.4);
  pointer-events: none; z-index: 10;
  white-space: nowrap;
}

/* Wish popup */
.wish {
  position: fixed;
  pointer-events: none;
  font-size: 0.85rem; font-weight: 800;
  color: #fff;
  text-shadow: 0 0 12px rgba(200,180,255,0.9);
  z-index: 20;
  animation: wishFloat 2s ease-out forwards;
  white-space: nowrap;
}
@keyframes wishFloat {
  0%   { opacity:1; transform:translateY(0) scale(1); }
  100% { opacity:0; transform:translateY(-60px) scale(1.1); }
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="cursor" id="cursor"></div>

<div class="ui">
  <div class="ui-item">
    <span class="ui-label">⭐ Stelle</span>
    <span class="ui-val" id="star-count">0</span>
  </div>
  <div class="ui-item">
    <span class="ui-label">🌠 Cadenti</span>
    <span class="ui-val" id="shoot-count">0</span>
  </div>
  <div class="ui-item">
    <span class="ui-label">🔭 Costellazioni</span>
    <span class="ui-val" id="const-count">0</span>
  </div>
</div>

<div class="hint">Tocca il cielo per aggiungere stelle ✨ · Collegane 3+ per una costellazione</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const cursor = document.getElementById('cursor');

let W, H;
function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const rand  = (a,b)  => a + Math.random()*(b-a);
const randInt=(a,b)  => Math.floor(rand(a,b+1));

// ── Background stars (static tiny) ────────────────────
let bgStars=[];
function initBgStars(){
  bgStars = Array.from({length:200},()=>({
    x: rand(0,W), y: rand(0,H),
    r: rand(0.3,1.2),
    alpha: rand(0.3,0.9),
    twinkleSpeed: rand(0.005,0.02),
    twinklePhase: rand(0,Math.PI*2),
  }));
}

// ── User-placed stars ──────────────────────────────────
let userStars=[];
let starCount=0, shootCount=0, constCount=0;

function addStar(x,y){
  userStars.push({
    x,y,
    r: rand(2,4.5),
    alpha: 0,
    targetAlpha: rand(0.7,1),
    twinkle: rand(0,Math.PI*2),
    twinkleSpeed: rand(0.02,0.05),
    color: randomStarColor(),
    birth: Date.now(),
    trails: [],
  });
  starCount++;
  document.getElementById('star-count').textContent = starCount;

  // Check for constellation (3+ stars within radius)
  checkConstellation(x,y);

  // Wish text
  const wishes=['Esprimi un desiderio ✨','Stella luminosa! 💫','Bellissima! 🌟','Un nuovo sogno ⭐','Scintillante! ✨'];
  showWish(x,y, wishes[randInt(0,wishes.length-1)]);
}

function randomStarColor(){
  const colors=['#fff','#ffe8c0','#c8d8ff','#ffd6f5','#c8fff0'];
  return colors[randInt(0,colors.length-1)];
}

function showWish(x,y,text){
  const el=document.createElement('div');
  el.className='wish';
  el.textContent=text;
  el.style.left=x+'px'; el.style.top=(y-20)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2000);
}

// ── Constellation detection ────────────────────────────
let constellations=[];

function checkConstellation(cx,cy){
  const nearby = userStars.filter(s=>Math.hypot(s.x-cx,s.y-cy)<160);
  if(nearby.length>=3){
    // Check if this group already has a constellation
    const key = nearby.map(s=>s.x.toFixed(0)+','+s.y.toFixed(0)).sort().join('|');
    if(!constellations.find(c=>c.key===key)){
      constellations.push({ stars: nearby, key, alpha:0, birth:Date.now() });
      constCount++;
      document.getElementById('const-count').textContent=constCount;
      showWish(cx,cy,'✨ Costellazione! ✨');
    }
  }
}

// ── Shooting stars ─────────────────────────────────────
let shooters=[];

function spawnShooter(){
  const fromTop = Math.random()<0.5;
  shooters.push({
    x: rand(0,W*0.7),
    y: fromTop ? rand(-20,H*0.3) : rand(0,H*0.4),
    vx: rand(5,12),
    vy: rand(2,6),
    len: rand(60,140),
    alpha: 1,
    r: rand(1.5,3),
    color: randomStarColor(),
    tail: [],
  });
  shootCount++;
  document.getElementById('shoot-count').textContent=shootCount;
}

// Auto spawn shooters
setInterval(()=>{ if(Math.random()<0.6) spawnShooter(); }, 2800);

// ── Moon ───────────────────────────────────────────────
let moonPhase=0;

function drawMoon(){
  moonPhase+=0.0003;
  const mx=W-80, my=70, mr=40;
  ctx.save();
  // Glow
  const g=ctx.createRadialGradient(mx,my,0,mx,my,mr*2.5);
  g.addColorStop(0,'rgba(255,250,220,0.15)');
  g.addColorStop(1,'transparent');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(mx,my,mr*2.5,0,Math.PI*2); ctx.fill();

  // Moon body
  ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2);
  ctx.fillStyle='#fff8d6'; ctx.fill();

  // Phase shadow
  ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2);
  ctx.fillStyle='rgba(6,8,15,0.5)';
  ctx.fill();
  // crescent
  const phase = (Math.sin(moonPhase)*0.5+0.5);
  ctx.beginPath();
  ctx.arc(mx+mr*(phase-0.5)*2,my,mr,0,Math.PI*2);
  ctx.fillStyle='#06080f'; ctx.fill();

  ctx.restore();
}

// ── Nebula blobs ───────────────────────────────────────
let nebulaT=0;
function drawNebula(){
  nebulaT+=0.003;
  const blobs=[
    {x:W*0.2,y:H*0.3,r:180,c:'rgba(100,60,160,0.06)'},
    {x:W*0.7,y:H*0.5,r:200,c:'rgba(60,100,180,0.05)'},
    {x:W*0.5,y:H*0.8,r:150,c:'rgba(160,60,120,0.06)'},
  ];
  blobs.forEach((b,i)=>{
    const ox=Math.sin(nebulaT+i)*20, oy=Math.cos(nebulaT*0.7+i)*20;
    const g=ctx.createRadialGradient(b.x+ox,b.y+oy,0,b.x+ox,b.y+oy,b.r);
    g.addColorStop(0,b.c); g.addColorStop(1,'transparent');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(b.x+ox,b.y+oy,b.r,0,Math.PI*2); ctx.fill();
  });
}

// ── Main draw ──────────────────────────────────────────
let t=0;
function loop(){
  t++;

  // Background
  ctx.fillStyle='#06080f'; ctx.fillRect(0,0,W,H);

  drawNebula();

  // BG stars twinkle
  bgStars.forEach(s=>{
    s.twinklePhase+=s.twinkleSpeed;
    const a=s.alpha*(0.6+0.4*Math.sin(s.twinklePhase));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
  });

  drawMoon();

  // Constellations (lines between nearby stars)
  constellations.forEach(c=>{
    c.alpha=Math.min(1,c.alpha+0.01);
    ctx.save();
    ctx.globalAlpha=c.alpha*0.35;
    ctx.strokeStyle='rgba(200,180,255,0.7)';
    ctx.lineWidth=0.8;
    ctx.setLineDash([4,4]);
    for(let i=0;i<c.stars.length;i++){
      for(let j=i+1;j<c.stars.length;j++){
        const a=c.stars[i], b=c.stars[j];
        if(Math.hypot(a.x-b.x,a.y-b.y)<160){
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    ctx.restore();
  });

  // User stars
  userStars.forEach(s=>{
    s.alpha=Math.min(s.targetAlpha,s.alpha+0.04);
    s.twinkle+=s.twinkleSpeed;
    const a=s.alpha*(0.75+0.25*Math.sin(s.twinkle));
    const r=s.r*(0.9+0.1*Math.sin(s.twinkle*1.3));

    // Glow
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*5);
    g.addColorStop(0,s.color.replace(')',',0.4)').replace('rgb','rgba').replace('#','rgba(').replace(/^rgba\(/,''));
    // simpler glow:
    ctx.save();
    ctx.globalAlpha=a*0.35;
    ctx.beginPath(); ctx.arc(s.x,s.y,r*4,0,Math.PI*2);
    ctx.fillStyle=s.color; ctx.fill();
    ctx.restore();

    // Star body
    ctx.save();
    ctx.globalAlpha=a;
    drawStar4(s.x,s.y,r,r*2.5,s.color);
    ctx.restore();
  });

  // Shooters
  shooters=shooters.filter(s=>s.alpha>0.02);
  shooters.forEach(s=>{
    s.tail.push({x:s.x,y:s.y});
    if(s.tail.length>20) s.tail.shift();
    s.x+=s.vx; s.y+=s.vy;
    s.alpha-=0.018;

    // Trail
    ctx.save();
    for(let i=1;i<s.tail.length;i++){
      const prog=i/s.tail.length;
      ctx.globalAlpha=s.alpha*prog*0.7;
      ctx.strokeStyle=s.color;
      ctx.lineWidth=s.r*prog;
      ctx.beginPath();
      ctx.moveTo(s.tail[i-1].x,s.tail[i-1].y);
      ctx.lineTo(s.tail[i].x,s.tail[i].y);
      ctx.stroke();
    }
    // Head
    ctx.globalAlpha=s.alpha;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle='white'; ctx.fill();
    ctx.restore();
  });

  requestAnimationFrame(loop);
}

function drawStar4(cx,cy,innerR,outerR,color){
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const angle=i*Math.PI/4-Math.PI/2;
    const r=i%2===0?outerR:innerR;
    const x=cx+Math.cos(angle)*r;
    const y=cy+Math.sin(angle)*r;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
}

// ── Events ─────────────────────────────────────────────
window.addEventListener('mousemove',e=>{
  cursor.style.left=e.clientX+'px';
  cursor.style.top=e.clientY+'px';
});

canvas.addEventListener('click',e=>{ addStar(e.clientX,e.clientY); });

canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  Array.from(e.touches).forEach(t=>addStar(t.clientX,t.clientY));
},{passive:false});

initBgStars();
loop();
</script>
</body>
</html>
