<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  font-family: 'Nunito', sans-serif;
  background: #fdf0f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Decorative blobs */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 400px; height: 400px;
  background: rgba(255, 182, 213, 0.35);
  top: -100px; left: -100px;
}
body::after {
  width: 350px; height: 350px;
  background: rgba(178, 235, 242, 0.30);
  bottom: -80px; right: -80px;
}

.container {
  position: relative; z-index: 1;
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* Header */
.header {
  text-align: center;
}

.title {
  font-size: 2rem;
  font-weight: 900;
  color: #d63384;
  letter-spacing: -0.5px;
  text-shadow: 0 2px 0 rgba(214, 51, 132, 0.15);
}

.subtitle {
  font-size: 0.85rem;
  color: #c76b9a;
  margin-top: 2px;
  font-weight: 600;
}

/* Stats bar */
.stats {
  display: flex;
  gap: 12px;
  width: 100%;
}

.stat-pill {
  flex: 1;
  background: white;
  border-radius: 99px;
  padding: 10px 16px;
  text-align: center;
  box-shadow: 0 4px 16px rgba(214, 51, 132, 0.10), 0 1px 3px rgba(0,0,0,0.06);
  border: 1.5px solid rgba(214, 51, 132, 0.10);
}

.stat-val {
  font-size: 1.3rem;
  font-weight: 900;
  color: #d63384;
  line-height: 1;
}

.stat-lbl {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #c76b9a;
  margin-top: 2px;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  width: 100%;
}

.card {
  aspect-ratio: 1;
  cursor: pointer;
  perspective: 600px;
  border-radius: 16px;
}

.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.38s cubic-bezier(.22,1,.36,1);
  border-radius: 16px;
}

.card.flipped .card-inner,
.card.matched .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-front {
  background: white;
  box-shadow: 0 4px 16px rgba(214,51,132,0.10), 0 1px 3px rgba(0,0,0,0.07);
  border: 1.5px solid rgba(214,51,132,0.12);
  font-size: 1.6rem;
  color: #e8a0bf;
  transition: background 0.18s;
}

.card:hover:not(.flipped):not(.matched) .card-front {
  background: #fff0f7;
}

.card-front .pattern {
  font-size: 1.4rem;
  opacity: 0.5;
  user-select: none;
}

.card-back {
  background: linear-gradient(135deg, #fff0f7 0%, #fce4f0 100%);
  box-shadow: 0 4px 20px rgba(214,51,132,0.18), 0 1px 3px rgba(0,0,0,0.07);
  border: 1.5px solid rgba(214,51,132,0.18);
  transform: rotateY(180deg);
  font-size: 2rem;
}

.card.matched .card-back {
  background: linear-gradient(135deg, #e8f8e8 0%, #d4f0d4 100%);
  box-shadow: 0 4px 20px rgba(72, 199, 116, 0.25);
  border-color: rgba(72, 199, 116, 0.30);
  animation: matchPop 0.4s cubic-bezier(.22,1,.36,1);
}

@keyframes matchPop {
  0%   { transform: rotateY(180deg) scale(1); }
  50%  { transform: rotateY(180deg) scale(1.12); }
  100% { transform: rotateY(180deg) scale(1); }
}

/* Win screen */
.win-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 32px;
  background: white;
  border-radius: 28px;
  box-shadow: 0 8px 40px rgba(214,51,132,0.15);
  border: 2px solid rgba(214,51,132,0.15);
  animation: floatUp 0.5s cubic-bezier(.22,1,.36,1);
  width: 100%;
}

.win-screen.show { display: flex; }

.win-emoji { font-size: 3.5rem; animation: bounce 0.6s ease infinite alternate; }
@keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

.win-title {
  font-size: 1.6rem;
  font-weight: 900;
  color: #d63384;
}

.win-sub {
  font-size: 0.9rem;
  color: #c76b9a;
  font-weight: 600;
}

.btn-restart {
  background: linear-gradient(135deg, #f472b6, #d63384);
  color: white;
  border: none;
  border-radius: 99px;
  padding: 12px 32px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(214,51,132,0.35);
  transition: transform 0.18s, box-shadow 0.18s;
}
.btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(214,51,132,0.40); }
.btn-restart:active { transform: translateY(0); }

@keyframes floatUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Difficulty selector */
.difficulty {
  display: flex;
  gap: 8px;
}

.diff-btn {
  padding: 7px 18px;
  border-radius: 99px;
  border: 2px solid rgba(214,51,132,0.20);
  background: white;
  font-family: 'Nunito', sans-serif;
  font-size: 0.8rem;
  font-weight: 800;
  color: #c76b9a;
  cursor: pointer;
  transition: all 0.18s;
}
.diff-btn:hover { border-color: #f472b6; color: #d63384; }
.diff-btn.active {
  background: linear-gradient(135deg, #f472b6, #d63384);
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(214,51,132,0.30);
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title">🌸 Memory</div>
    <div class="subtitle">Trova tutte le coppie!</div>
  </div>

  <div class="difficulty">
    <button class="diff-btn active" onclick="setDiff(4)" id="diff-4">4×4</button>
    <button class="diff-btn" onclick="setDiff(5)" id="diff-5">5×4</button>
  </div>

  <div class="stats">
    <div class="stat-pill">
      <div class="stat-val" id="moves">0</div>
      <div class="stat-lbl">Mosse</div>
    </div>
    <div class="stat-pill">
      <div class="stat-val" id="pairs">0</div>
      <div class="stat-lbl">Coppie</div>
    </div>
    <div class="stat-pill">
      <div class="stat-val" id="timer">0:00</div>
      <div class="stat-lbl">Tempo</div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="win-screen" id="win">
    <div class="win-emoji">🎉</div>
    <div class="win-title">Hai vinto!</div>
    <div class="win-sub" id="win-sub"></div>
    <button class="btn-restart" onclick="startGame()">Gioca ancora ✨</button>
  </div>

</div>

<script>
const ALL_EMOJIS = [
  // fiori & natura
  '🌸','🌺','🌻','🌹','🌷','🌼','🌿','🍀','🍁','🌙',
  // animali
  '🐱','🐶','🐰','🦊','🐻','🐼','🐨','🐸','🦋','🐝',
  // cibo
  '🍓','🍩','🧁','🍦','🍋','🍇','🍑','🍒','🫐','🍰',
];

let cols = 4, rows = 4, totalPairs = 8;
let flipped = [], matched = [], moves = 0, seconds = 0, timerID = null, locked = false;

function setDiff(c) {
  cols = c; rows = 4; totalPairs = (cols * rows) / 2;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('diff-' + c).classList.add('active');
  document.getElementById('grid').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  startGame();
}

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]] = [b[j],b[i]];
  }
  return b;
}

function startGame() {
  clearInterval(timerID);
  flipped = []; matched = []; moves = 0; seconds = 0; locked = false;
  document.getElementById('moves').textContent = '0';
  document.getElementById('pairs').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('win').classList.remove('show');

  const emojis = shuffle(ALL_EMOJIS).slice(0, totalPairs);
  const cards = shuffle([...emojis, ...emojis]);

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  cards.forEach((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.index = i;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front"><span class="pattern">✿</span></div>
        <div class="card-back">${emoji}</div>
      </div>`;
    card.addEventListener('click', () => flipCard(card));
    grid.appendChild(card);
  });

  timerID = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds/60);
    const s = seconds % 60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function flipCard(card) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    locked = true;
    moves++;
    document.getElementById('moves').textContent = moves;

    if (flipped[0].dataset.emoji === flipped[1].dataset.emoji) {
      flipped.forEach(c => c.classList.add('matched'));
      matched.push(...flipped);
      flipped = [];
      locked = false;
      document.getElementById('pairs').textContent = matched.length / 2;

      if (matched.length === cols * rows) {
        clearInterval(timerID);
        const m = Math.floor(seconds/60);
        const s = seconds % 60;
        document.getElementById('win-sub').textContent =
          `${moves} mosse in ${m}:${s.toString().padStart(2,'0')} ✨`;
        setTimeout(() => document.getElementById('win').classList.add('show'), 400);
      }
    } else {
      setTimeout(() => {
        flipped.forEach(c => c.classList.remove('flipped'));
        flipped = [];
        locked = false;
      }, 900);
    }
  }
}

startGame();
</script>
</body>
</html>
